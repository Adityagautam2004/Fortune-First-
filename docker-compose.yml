services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=fortunefirst
      - POSTGRES_USER=ff_user
      - POSTGRES_PASSWORD=local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
      backend:
    build: ./fortune-first-backend
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://ff_user:local_dev_password@postgres:5432/fortunefirst
      - REDIS_URL=redis://redis:6379
      - PORT=4000
    ports:
      - "4000:4000"

volumes:
  postgres_data:
